name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: 'Clipboard Pro Android/gradle/wrapper/gradle-wrapper.properties'

    - name: Grant execution permission for gradlew
      run: chmod +x "Clipboard Pro Android/gradlew"

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: "Clipboard Pro Android"

    - name: Rename APK to ClipboardPro.apk
      run: mv "Clipboard Pro Android/app/build/outputs/apk/debug/app-debug.apk" "Clipboard Pro Android/app/build/outputs/apk/debug/ClipboardPro.apk"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ClipboardPro
        path: Clipboard Pro Android/app/build/outputs/apk/debug/ClipboardPro.apk
